<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><title>Pitch Correction Studio</title><link rel="stylesheet" href="./styles.css"></head><body><header><strong>PITCH CORRECTION STUDIO</strong><span>v1.3.0 · NOTE EDITOR</span></header><nav><label class="file">Import Vocal<input type="file" id="file" accept="audio/*,.wav,.flac,.m4a,.mp3"></label><button id="original" disabled>▶ Before</button><button id="processed" disabled>▶ After</button><button id="stop">■ Stop</button><button id="render" disabled>Render Correction</button><button id="export" disabled>Export WAV</button></nav><section class="tools"><label>Time Zoom<input id="zoom" type="range" min="0.5" max="12" step="0.1" value="1"></label><label>Note Cents<input id="cents" type="range" min="-100" max="100" value="0"></label><span id="selection">Import audio to detect notes</span></section><main><div class="heading"><span>PIANO ROLL <small>Drag note: pitch · Drag background: pan · Pinch: zoom · Tap ruler: seek</small></span><span id="time">0:00 / 0:00</span></div><div class="editor-frame"><canvas id="editor" aria-label="Interactive pitch note editor"></canvas></div><div class="heading">WAVEFORM · PLAYBACK</div><div class="wave-frame"><canvas id="wave" aria-label="Audio waveform"></canvas></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback seek position"></main><footer><span id="status">Import a dry, monophonic vocal recording.</span><span id="duration">0:00</span></footer><script type="module" src="./main.js"></script></body></html>
