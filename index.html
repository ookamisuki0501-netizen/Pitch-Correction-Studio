<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101521"><title>Pitch Correction Studio</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><h1>PITCH CORRECTION STUDIO <small>v1.1.0</small></h1><span id="status">Ready</span></header><section class="toolbar"><label class="file">LOAD AUDIO<input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac"></label><button id="original">PLAY ORIGINAL</button><button id="processed" disabled>PLAY PROCESSED</button><button id="stop">STOP</button><button id="export" disabled>EXPORT WAV</button></section><section class="settings"><label>TRANSPOSE <strong id="amount">0 semitones</strong><input id="transpose" type="range" min="-12" max="12" step="1" value="0"></label><button id="render" disabled>APPLY PITCH SHIFT</button><label>Playback <input id="seek" type="range" min="0" max="1000" value="0"></label><span id="duration">0:00</span></section><section class="view"><h2>WAVEFORM</h2><canvas id="wave"></canvas><h2>DETECTED PITCH (YIN)</h2><canvas id="pitch"></canvas></section><footer id="info">Load a monophonic vocal recording to begin. This experimental shifter is best for sustained notes.</footer></main><script type="module" src="./main.js"></script></body></html>
