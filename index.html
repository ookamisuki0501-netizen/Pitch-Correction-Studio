<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131e"><title>Pitch Correction Studio</title><link rel="stylesheet" href="./UI/styles/main.css"></head><body><main id="app"><h1>Pitch Correction Studio</h1><p id="status">Load an audio file to begin.</p><section class="bar"><label class="file">Open Audio <input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac"></label><button id="play" disabled>Play</button><button id="stop" disabled>Stop</button><button id="compare" disabled>Original</button></section><section><canvas id="wave" width="1200" height="160" aria-label="Audio waveform"></canvas><input id="seek" type="range" min="0" max="1000" value="0" disabled><div id="time">0:00 / 0:00</div></section><section><h2>Detected F0</h2><div id="pitch">No analysis</div><canvas id="curve" width="1200" height="180" aria-label="Detected pitch"></canvas></section><section class="bar"><label>Transpose (semitones) <output id="amount">0</output><input id="shift" type="range" min="-12" max="12" step="1" value="0"></label><button id="render" disabled>Apply Pitch Shift</button><button id="export" disabled>Export WAV</button></section><p id="progress" role="status"></p><p class="note">Offline processing. Preview and exported WAV use the same processed samples. Best results on isolated monophonic voice.</p></main><script type="module" src="./main.js"></script></body></html>
