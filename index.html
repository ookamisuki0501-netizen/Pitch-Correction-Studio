<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#101522"><title>Pitch Correction Studio</title><link rel="stylesheet" href="./styles.css"></head><body><header><strong>PITCH CORRECTION STUDIO</strong><span>v1.2.1 • TOUCH EDITOR</span></header><nav><label class="file">Import Vocal <input type="file" id="file" accept="audio/*,.wav,.flac,.m4a,.mp3"></label><button id="original" disabled>Before ▶</button><button id="processed" disabled>After ▶</button><button id="stop">Stop ■</button><button id="render" disabled>Render Correction</button><button id="export" disabled>Export WAV</button></nav><section class="tools"><label>Horizontal Zoom <input id="zoom" type="range" min="0.5" max="6" step="0.1" value="1"></label><label>Scroll <input id="scroll" type="range" min="0" max="100" value="0"></label><label>Selected Note Cents <input id="cents" type="range" min="-100" max="100" value="0"></label><span id="selection">Drag notes to retune · Drag empty space to pan · Pinch to zoom.</span></section><main><div class="heading">PITCH EDITOR <small>Orange: detected F0 · Blue: editable notes</small></div><canvas id="editor"></canvas><div class="heading">WAVEFORM / PLAYHEAD</div><canvas id="wave"></canvas><input id="seek" type="range" min="0" max="1000" value="0"></main><footer><span id="status">Import a dry, monophonic vocal recording.</span><span id="duration">0:00</span></footer><script type="module" src="./main.js"></script></body></html>
